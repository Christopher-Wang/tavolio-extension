services:
  # Interactive dev shell: source is bind-mounted, so run
  # `docker compose run --rm base npm install` once first (writes
  # node_modules back to the host dir through the mount), then
  # `docker compose run --rm base npm run build`.
  base:
    build:
      context: .
      target: base
    volumes:
      - .:/repo
    working_dir: /repo

  # Self-contained: uses dist + node_modules baked in at image build time.
  # No volumes, no install needed. Rebuild image to pick up source changes.
  test:
    build:
      context: .
      target: test

  typecheck:
    build:
      context: .
      target: base
    command: npm run typecheck --workspaces --if-present

  # Dev server with hot reload: https://localhost:3000 (HTTPS when .docker/certs exists;
  # see docker/gen-certs.sh). Serves the mock spreadsheet in a browser, and the real
  # UI to Excel (manifest.local.xml) and Sheets ("Open Tavolio (local https)").
  # Requires the one-time install + build via `base` first (see above).
  app:
    build:
      context: .
      target: app
    volumes:
      - .:/repo
    working_dir: /repo
    ports:
      - "3000:3000"
    command: npm run dev --workspace=google-sheets -- --host 0.0.0.0 --port 3000
