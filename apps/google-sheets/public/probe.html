<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body { font: 13px/1.4 system-ui, sans-serif; margin: 12px; color: #202124; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid #eee; }
  .k { color: #5f6368; }
  .v { text-align: right; word-break: break-word; max-width: 60%; }
  .ok { color: #188038; } .bad { color: #c5221f; } .warn { color: #b06000; }
  textarea { width: 100%; height: 140px; font: 11px monospace; margin-top: 8px; box-sizing: border-box; }
  button { margin-top: 6px; }
</style>
</head>
<body>
<h1>Tavolio device check</h1>
<div id="status">Running…</div>
<div id="rows"></div>
<textarea id="json" readonly></textarea>
<button id="copy">Copy results</button>
<script>
(async function () {
  const results = {};
  const rows = document.getElementById("rows");

  function show(key, value, level) {
    results[key] = value;
    const div = document.createElement("div");
    div.className = "row";
    div.innerHTML = '<span class="k"></span><span class="v"></span>';
    div.children[0].textContent = key;
    div.children[1].textContent = typeof value === "object" ? JSON.stringify(value) : String(value);
    if (level) div.children[1].className = "v " + level;
    rows.appendChild(div);
  }

  async function step(key, fn) {
    try {
      const out = await fn();
      show(key, out.value, out.level || "ok");
      return out.value;
    } catch (e) {
      show(key, "FAILED: " + (e && e.message ? e.message : e), "bad");
      return undefined;
    }
  }

  // --- Environment -------------------------------------------------------
  show("origin", location.origin);
  show("userAgent", navigator.userAgent);
  show("inIframe", window.self !== window.top);
  show("isSecureContext", isSecureContext, isSecureContext ? "ok" : "bad");
  show("crossOriginIsolated", !!self.crossOriginIsolated, self.crossOriginIsolated ? "ok" : "warn");
  show("hardwareConcurrency", navigator.hardwareConcurrency);
  show("deviceMemoryGB", navigator.deviceMemory ?? "n/a");

  // --- WebGPU ------------------------------------------------------------
  show("navigator.gpu", !!navigator.gpu, navigator.gpu ? "ok" : "bad");
  let adapter, device;
  if (navigator.gpu) {
    // Try several option sets: which ones return an adapter narrows down
    // "iframe blocks WebGPU" vs "this machine's GPU is blocklisted/disabled".
    const attempts = {};
    for (const [name, opts] of [
      ["high-performance", { powerPreference: "high-performance" }],
      ["default", undefined],
      ["low-power", { powerPreference: "low-power" }],
      ["fallback (software)", { forceFallbackAdapter: true }],
    ]) {
      try {
        const a = await navigator.gpu.requestAdapter(opts);
        attempts[name] = a ? "ok" : "null";
        if (a && !adapter && name !== "fallback (software)") adapter = a;
      } catch (e) {
        attempts[name] = "error: " + (e && e.message ? e.message : e);
      }
    }
    show("requestAdapter attempts", attempts, adapter ? "ok" : "bad");
    adapter = await step("requestAdapter", async () => {
      if (!adapter) throw new Error("no hardware adapter (see attempts)");
      return { value: adapter };
    });
    if (adapter) {
      results.requestAdapter = "ok";
      rows.lastChild.children[1].textContent = "ok";
      await step("adapterInfo", async () => {
        const info = adapter.info || (adapter.requestAdapterInfo ? await adapter.requestAdapterInfo() : {});
        return { value: { vendor: info.vendor, architecture: info.architecture, device: info.device, description: info.description } };
      });
      show("shader-f16", adapter.features.has("shader-f16"), adapter.features.has("shader-f16") ? "ok" : "warn");
      show("limits", {
        maxBufferSize: adapter.limits.maxBufferSize,
        maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
        maxComputeWorkgroupStorageSize: adapter.limits.maxComputeWorkgroupStorageSize,
        maxComputeInvocationsPerWorkgroup: adapter.limits.maxComputeInvocationsPerWorkgroup,
      });
      device = await step("requestDevice", async () => ({ value: await adapter.requestDevice() }));
      if (device) {
        results.requestDevice = "ok";
        rows.lastChild.children[1].textContent = "ok";
        await step("computeShader (1M floats x2)", async () => {
          const N = 1 << 20;
          const input = new Float32Array(N);
          for (let i = 0; i < N; i++) input[i] = i;
          const t0 = performance.now();
          const buf = device.createBuffer({ size: input.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
          device.queue.writeBuffer(buf, 0, input);
          const read = device.createBuffer({ size: input.byteLength, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
          const module = device.createShaderModule({ code: `
            @group(0) @binding(0) var<storage, read_write> data: array<f32>;
            @compute @workgroup_size(64)
            fn main(@builtin(global_invocation_id) id: vec3<u32>) {
              if (id.x < arrayLength(&data)) { data[id.x] = data[id.x] * 2.0; }
            }` });
          const pipeline = device.createComputePipeline({ layout: "auto", compute: { module, entryPoint: "main" } });
          const bind = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: buf } }] });
          const enc = device.createCommandEncoder();
          const pass = enc.beginComputePass();
          pass.setPipeline(pipeline);
          pass.setBindGroup(0, bind);
          pass.dispatchWorkgroups(Math.ceil(N / 64));
          pass.end();
          enc.copyBufferToBuffer(buf, 0, read, 0, input.byteLength);
          device.queue.submit([enc.finish()]);
          await read.mapAsync(GPUMapMode.READ);
          const out = new Float32Array(read.getMappedRange().slice(0));
          read.unmap();
          const ms = Math.round(performance.now() - t0);
          if (out[12345] !== 24690 || out[N - 1] !== (N - 1) * 2) throw new Error("wrong result");
          return { value: "ok (" + ms + " ms incl. setup)" };
        });
      }
    }
  }

  // --- Wasm fallback -----------------------------------------------------
  await step("wasm SIMD", async () => {
    const simd = new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11]);
    const ok = WebAssembly.validate(simd);
    return { value: ok, level: ok ? "ok" : "warn" };
  });
  show("SharedArrayBuffer (wasm threads)", typeof SharedArrayBuffer !== "undefined" && !!self.crossOriginIsolated,
    typeof SharedArrayBuffer !== "undefined" && self.crossOriginIsolated ? "ok" : "warn");

  // --- Workers (inference off the UI thread) -----------------------------
  await step("blob Worker", () => new Promise((resolve, reject) => {
    const url = URL.createObjectURL(new Blob(["onmessage = e => postMessage(e.data * 2)"], { type: "text/javascript" }));
    const w = new Worker(url);
    const timer = setTimeout(() => reject(new Error("timeout")), 3000);
    w.onmessage = (e) => { clearTimeout(timer); w.terminate(); resolve({ value: e.data === 42 ? "ok" : "bad reply" }); };
    w.onerror = (e) => { clearTimeout(timer); reject(new Error(e.message || "worker error")); };
    w.postMessage(21);
  }));
  await step("WebGPU in Worker", () => new Promise((resolve, reject) => {
    const src = "onmessage = async () => { try { const a = navigator.gpu && await navigator.gpu.requestAdapter(); postMessage(a ? 'ok' : 'no adapter'); } catch (e) { postMessage('error: ' + e.message); } }";
    const w = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
    const timer = setTimeout(() => reject(new Error("timeout")), 5000);
    w.onmessage = (e) => { clearTimeout(timer); w.terminate(); resolve({ value: e.data, level: e.data === "ok" ? "ok" : "warn" }); };
    w.postMessage(0);
  }));

  // --- Storage (model cache) ---------------------------------------------
  await step("storage.estimate", async () => {
    const est = await navigator.storage.estimate();
    return { value: { quotaMB: Math.round(est.quota / 1e6), usageMB: Math.round(est.usage / 1e6) } };
  });
  await step("IndexedDB", () => new Promise((resolve, reject) => {
    const req = indexedDB.open("tavolio-probe", 1);
    req.onsuccess = () => { req.result.close(); resolve({ value: "ok" }); };
    req.onerror = () => reject(req.error);
  }));
  await step("Cache API", async () => {
    const c = await caches.open("tavolio-probe");
    await c.put("/probe", new Response("x"));
    return { value: "ok" };
  });

  // --- Network: can the sidebar fetch the runtime + model? ----------------
  async function probeFetch(url) {
    const t0 = performance.now();
    const r = await fetch(url, { mode: "cors" });
    await r.arrayBuffer();
    return { value: r.status + " (" + Math.round(performance.now() - t0) + " ms)", level: r.ok ? "ok" : "warn" };
  }
  await step("fetch jsdelivr (onnxruntime-web)", () => probeFetch("https://cdn.jsdelivr.net/npm/onnxruntime-web/package.json"));
  await step("fetch huggingface.co", () => probeFetch("https://huggingface.co/api/models?limit=1"));

  document.getElementById("status").textContent = "Done.";
  document.getElementById("json").value = JSON.stringify(results, null, 2);
  document.getElementById("copy").onclick = () => {
    const t = document.getElementById("json");
    t.select();
    document.execCommand("copy");
  };
})();
</script>
</body>
</html>
